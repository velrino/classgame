substitutions:
  _REGION: us-east1
  _REPOSITORY: classgame
  _SERVICE_NAME: classgame-api
  _APP_DIR: api
  _APP_ENV: production
  # Historical API runtime identity; review least privilege before a new deployment.
  _RUNTIME_SERVICE_ACCOUNT_EMAIL: 2057331207-compute@developer.gserviceaccount.com
  # Historical submitted frontend origin; override before redeploying at a new URL.
  _CORS_ALLOWED_ORIGINS: https://classgame-web-2057331207.us-east1.run.app
  _IMAGE_TAG: production
  _FIREBASE_PROJECT_ID: allthingsagentichackatho-ee359
  _FIREBASE_STORAGE_BUCKET: allthingsagentichackatho-ee359.firebasestorage.app
  _FIREBASE_SECRET_NAME: allthingsagentichackathon-api-firebase-credentials-json
  _REDIS_SECRET_NAME: unshatter-api-redis-url
  _GENAI_ENABLED: "true"
  _GENAI_BACKEND: vertex
  _GENAI_MODEL: gemini-3.7-flash
  _GENAI_PROJECT_ID: rare-tape-466414-f4
  _GENAI_LOCATION: global
  _STUDENT_ABANDONMENT_SECONDS: "120"
  _POSTHOG_ENABLED: "true"
  _POSTHOG_PROJECT_TOKEN: phc_rSqPFFgY7jqf7XxP7QAXXUhZ76Wt9HtJGKZx4A2EXfz4
  _POSTHOG_HOST: https://us.i.posthog.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ${_APP_DIR}/infra/cloud-run/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - ${_APP_DIR}

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT_EMAIL}
      - --port
      - "8080"
      - --memory
      - 4Gi
      - --cpu
      - "1"
      - --no-cpu-throttling
      - --timeout
      - 300s
      - --concurrency
      - "200"
      - --min-instances
      - "0"
      - --max-instances
      - "3"
      - --update-env-vars
      - ^|^APP_ENV=${_APP_ENV}|APP_ROLE=api|TASKS_ENABLED=false|CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}|FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}|FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}|STUDENT_ABANDONMENT_SECONDS=${_STUDENT_ABANDONMENT_SECONDS}|AUTH_TEACHER_PROVIDERS=google,password|AUTH_STUDENT_PROVIDERS=anonymous|GENAI_ENABLED=${_GENAI_ENABLED}|GENAI_BACKEND=${_GENAI_BACKEND}|GENAI_MODEL=${_GENAI_MODEL}|GENAI_PROJECT_ID=${_GENAI_PROJECT_ID}|GENAI_LOCATION=${_GENAI_LOCATION}|GENAI_REQUEST_TIMEOUT_SECONDS=30|GENAI_MAX_OUTPUT_TOKENS=4096|POSTHOG_ENABLED=${_POSTHOG_ENABLED}|POSTHOG_PROJECT_TOKEN=${_POSTHOG_PROJECT_TOKEN}|POSTHOG_HOST=${_POSTHOG_HOST}
      - --update-secrets
      - FIREBASE_CREDENTIALS_JSON=${_FIREBASE_SECRET_NAME}:latest,REDIS_URL=${_REDIS_SECRET_NAME}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
